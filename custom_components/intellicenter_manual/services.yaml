commission_abort_own_tcp:
  name: Commission replacement TCP interruption
  description: >-
    Commissioning-only test. Immediately invalidates native observations and
    aborts only this integration's TCP socket to exercise automatic recovery.
    Does not send equipment commands or disconnect PoolOS.
  fields:
    entry_id:
      name: Replacement config entry ID
      description: Exact config entry ID of the replacement IntelliCenter integration.
      required: true
      example: "01M4F1DFGA4AH4F9E9M7MJCR5Q"
      selector:
        text:
    confirm:
      name: Explicit confirmation
      description: Enter ABORT_REPLACEMENT_TCP_ONLY.
      required: true
      example: "ABORT_REPLACEMENT_TCP_ONLY"
      selector:
        text:

arm_manual_thermostats:
  name: Arm native Pool and Hot Tub thermostats
  description: >-
    Enables only native Pool/Spa manual thermostat commands for this runtime.
    Fails unless both PoolOS legacy thermostats explicitly report manual
    command delivery disabled and both PoolOS autonomous controls are off.
    Disarms on native connection loss, HA restart, or explicit disarm.
  fields:
    entry_id:
      required: true
      selector:
        text:
    confirm:
      required: true
      description: Enter ARM_NATIVE_THERMOSTATS.
      selector:
        text:

disarm_manual_thermostats:
  name: Disarm native Pool and Hot Tub thermostats
  description: Immediately disables the native thermostat command gateway.
  fields:
    entry_id:
      required: true
      selector:
        text:

apply_rpm_configuration:
  name: Apply Configuration Changes
  description: Validate and commit draft RPM policy, reconcile permitted differences, and verify native readbacks. No equipment ON/OFF commands.
  fields:
    entry_id:
      required: true
      selector:
        text:

reconcile_pump_speeds:
  name: Reconcile Pump Speeds
  description: Explicit manual/default, scheduled and session reasons discover ordinary drift. recovery_heartbeat/grid_policy only service durable pending work and safety recovery. Single guarded writer and verified readback remain mandatory.
  fields:
    entry_id:
      required: true
      selector:
        text:
    reason:
      selector:
        text:

configure_rpm_guardian:
  name: Configure RPM Guardian commissioning gate
  description: Explicit supervised commissioning authorization. Deployments start write-disarmed. Flow floors are conservative commissioning constraints, not manufacturer minimum-flow claims.
  fields:
    entry_id:
      required: true
      selector:
        text:
    confirm:
      required: true
      description: Enter AUTHORIZE_RPM_GUARDIAN_COMMISSIONING only for an authorized supervised sequence.
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
    approve_running_pool_write:
      description: Explicit operator approval to test and subsequently use the running-Pool preset change under guarded conditions.
      selector:
        boolean:
    settling_seconds:
      selector:
        number:
          min: 180
          max: 900
          unit_of_measurement: s
    minimums:
      description: Approved minimum RPM per policy key after equipment-flow review. Omitted floors remain unchanged.
      selector:
        object:
