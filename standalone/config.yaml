name: Pool & Spa Family
version: "0.1.0"
slug: pool_spa_family
description: Simple family pool and spa controls through Home Assistant
url: https://github.com/davidabuch/Home-assistant-intellicenter
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
host_network: true
webui: "[PROTO:http]://[HOST]:[PORT:8101]"
watchdog: http://[HOST]:8101/api/health
options:
  family_pin: ""
schema:
  family_pin: password
