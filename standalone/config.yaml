name: Pool & Spa Family
version: "0.1.6"
slug: pool_spa_family
description: Simple family pool and spa controls through Home Assistant
url: https://github.com/davidabuch/Home-assistant-intellicenter
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
host_network: true
webui: "[PROTO:http]://[HOST]:[PORT:8101]"
watchdog: http://[HOST]:8101/api/health
options:
  family_pin: ""
  family_trusted_proxies: ""
  family_proxy_secret: ""
  family_public_origin: ""
  family_admin_handoff_secret: ""
  cf_access_issuer: ""
  cf_access_audience: ""
  cf_access_users: ""
  family_home_origin: ""
  family_remote_public_origin: ""
  family_remote_home_origin: ""
schema:
  family_pin: password
  family_trusted_proxies: str
  family_proxy_secret: password
  family_public_origin: str
  family_admin_handoff_secret: password
  cf_access_issuer: str
  cf_access_audience: str
  cf_access_users: str
  family_home_origin: str
  family_remote_public_origin: str
  family_remote_home_origin: str
