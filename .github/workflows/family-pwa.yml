name: Family Pool Spa PWA
on:
  push:
    paths:
      - 'standalone/**'
      - '.github/workflows/family-pwa.yml'
  pull_request:
    paths:
      - 'standalone/**'
      - '.github/workflows/family-pwa.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: davidabuch/Family_Home
          ref: fcdb069b7c791a1af771991c1c226c0df444cb49
          path: _family_home
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install authentication dependencies
        run: pip install -r standalone/requirements.txt Pillow==11.3.0
      - name: Verify approved icon derivatives
        run: python standalone/scripts/generate_icons.py --check && python standalone/scripts/test_icon_artwork.py
      - name: Compile backend
        run: python -m compileall -q standalone
      - name: Unit and cross-repository signer tests
        env:
          FAMILY_HOME_SOURCE: ${{ github.workspace }}/_family_home
        run: python -m unittest discover -s standalone/tests -v
      - name: Check frontend JavaScript
        run: node --check standalone/web/app.js && node --check standalone/web/sw.js && node --check standalone/web/admin-handoff.js
      - name: Browser handoff integration tests
        env:
          FAMILY_HOME_SOURCE: ${{ github.workspace }}/_family_home
        run: node --test standalone/tests/js/*.cjs
      - name: Check PWA manifest
        run: python -c "import json; m=json.load(open('standalone/web/manifest.webmanifest')); assert m['display']=='standalone'; assert m['icons']"
      - name: Install browser for PR 124 visual acceptance capture
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture iPhone-class PR 124 composition
        env:
          PORT: "8765"
          SESSION_FILE: "/tmp/pool-family-role-sessions.json"
        run: |
          python standalone/server.py >/tmp/pool-family-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node standalone/tests/js/capture_pr124_visual.cjs
      - name: Upload PR 124 visual acceptance screenshot
        uses: actions/upload-artifact@v4
        with:
          name: pr124-iphone-visual
          path: standalone/visual-acceptance-pr124.png
          if-no-files-found: error
