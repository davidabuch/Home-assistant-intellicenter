name: Opportunistic Spa policy tests

on:
  pull_request:
    paths:
      - 'custom_components/intellicenter_manual/opportunistic_spa_policy.py'
      - 'tests/test_opportunistic_spa_policy.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_source_policy.py'
      - 'tests/test_opportunistic_spa_source_policy.py'
      - 'ha_automations/heating_preference.json'
      - 'tests/test_opportunistic_spa_heating_preference_guard.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_command_plan.py'
      - 'tests/test_opportunistic_spa_command_plan.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_provenance.py'
      - 'tests/test_opportunistic_spa_provenance.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_collision.py'
      - 'tests/test_opportunistic_spa_collision.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_native_adapter.py'
      - 'tests/test_opportunistic_spa_native_adapter.py'
      - '.github/workflows/opportunistic-spa-policy.yml'
  push:
    branches:
      - 'feature/opportunistic-spa-solar-current-main'
    paths:
      - 'custom_components/intellicenter_manual/opportunistic_spa_policy.py'
      - 'tests/test_opportunistic_spa_policy.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_source_policy.py'
      - 'tests/test_opportunistic_spa_source_policy.py'
      - 'ha_automations/heating_preference.json'
      - 'tests/test_opportunistic_spa_heating_preference_guard.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_command_plan.py'
      - 'tests/test_opportunistic_spa_command_plan.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_provenance.py'
      - 'tests/test_opportunistic_spa_provenance.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_collision.py'
      - 'tests/test_opportunistic_spa_collision.py'
      - 'custom_components/intellicenter_manual/opportunistic_spa_native_adapter.py'
      - 'tests/test_opportunistic_spa_native_adapter.py'
      - '.github/workflows/opportunistic-spa-policy.yml'

jobs:
  pure-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile pure policy and tests
        run: python -m py_compile custom_components/intellicenter_manual/opportunistic_spa_policy.py tests/test_opportunistic_spa_policy.py custom_components/intellicenter_manual/opportunistic_spa_source_policy.py tests/test_opportunistic_spa_source_policy.py tests/test_opportunistic_spa_heating_preference_guard.py custom_components/intellicenter_manual/opportunistic_spa_command_plan.py tests/test_opportunistic_spa_command_plan.py custom_components/intellicenter_manual/opportunistic_spa_provenance.py tests/test_opportunistic_spa_provenance.py custom_components/intellicenter_manual/opportunistic_spa_collision.py tests/test_opportunistic_spa_collision.py custom_components/intellicenter_manual/opportunistic_spa_native_adapter.py tests/test_opportunistic_spa_native_adapter.py
      - name: Run no-hardware policy tests
        run: python -m unittest discover -s tests -p 'test_opportunistic_spa*.py' -v
