name: Validate integration scaffold
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate manifest and Python syntax
        run: |
          python -m json.tool custom_components/intellicenter_manual/manifest.json >/dev/null
          python -m json.tool hacs.json >/dev/null
          python -m compileall -q custom_components/intellicenter_manual

      - name: Test manual-only boundary
        run: python -m unittest discover -s tests -v
